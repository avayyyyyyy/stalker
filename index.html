<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>_STALKER | OpenRouter Monitor</title>

    <!-- Google Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
              destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
              card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
              popover: { DEFAULT: "hsl(var(--popover))", foreground: "hsl(var(--popover-foreground))" },
              orange: "hsl(var(--orange))",
            },
            borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
            fontFamily: { mono: ['"JetBrains Mono"', "monospace"] },
            animation: { "pulse-fast": "pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite" },
          },
        },
      };
    </script>

    <style type="text/tailwindcss">
      @layer base {
        :root {
          --background: 0 0% 100%; --foreground: 0 0% 0%;
          --card: 0 0% 100%; --card-foreground: 0 0% 0%;
          --popover: 0 0% 100%; --popover-foreground: 0 0% 0%;
          --primary: 0 0% 0%; --primary-foreground: 0 0% 100%;
          --secondary: 0 0% 96%; --secondary-foreground: 0 0% 45%;
          --muted: 0 0% 96%; --muted-foreground: 0 0% 45%;
          --accent: 0 0% 96%; --accent-foreground: 0 0% 0%;
          --destructive: 0 84.2% 60.2%; --destructive-foreground: 0 0% 100%;
          --border: 0 0% 90%; --input: 0 0% 90%; --ring: 0 0% 0%;
          --radius: 0.5rem; --orange: 25 95% 53%;
        }
        .dark {
          --background: 0 0% 7%; --foreground: 0 0% 98%;
          --card: 0 0% 7%; --card-foreground: 0 0% 98%;
          --popover: 0 0% 7%; --popover-foreground: 0 0% 98%;
          --primary: 0 0% 98%; --primary-foreground: 0 0% 7%;
          --secondary: 0 0% 12%; --secondary-foreground: 0 0% 55%;
          --muted: 0 0% 12%; --muted-foreground: 0 0% 55%;
          --accent: 0 0% 12%; --accent-foreground: 0 0% 98%;
          --destructive: 0 62.8% 30.6%; --destructive-foreground: 0 0% 98%;
          --border: 0 0% 15%; --input: 0 0% 15%; --ring: 0 0% 83.9%;
          --orange: 25 95% 53%;
        }
      }
      @layer base {
        * { @apply border-border; }
        body { @apply bg-background text-foreground font-mono overflow-x-hidden; }
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { @apply bg-background; }
      ::-webkit-scrollbar-thumb { @apply bg-muted-foreground/30 rounded; }
      ::-webkit-scrollbar-thumb:hover { @apply bg-orange; }
      .glow-text { color: hsl(var(--orange)); text-shadow: 0 0 20px hsla(var(--orange), 0.3); }
      .glass-panel { @apply bg-background/70 backdrop-blur-md border-b border-border shadow-lg; }
      .card-hover { transition: all 0.3s ease; }
      .card-hover:hover { transform: translateY(-2px); @apply shadow-[0_0_15px_hsla(var(--orange),0.15)] border-orange/50; }
      .modal-slide-in { animation: slideIn 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1); }
      .modal-slide-out { animation: slideOut 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
      @keyframes slideOut { from { transform: translateX(0); } to { transform: translateX(100%); } }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-40 glass-panel">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-extrabold tracking-tighter glow-text">STALKER</h1>
          <span class="hidden md:inline border-l border-border h-5"></span>
          <span class="hidden md:flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-orange animate-pulse"></span>
            <span class="text-orange text-xs tracking-wider uppercase font-semibold">Live</span>
          </span>
          <span class="hidden lg:inline border-l border-border h-5"></span>
          <span id="last-updated" class="hidden lg:inline text-xs text-muted-foreground"></span>
        </div>
        <div class="flex items-center gap-4">
          <div class="w-32 md:w-48">
            <div class="relative group w-full">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              </div>
              <input type="text" id="search-input" oninput="handleSearch(this.value)" class="block w-full pl-10 pr-3 py-2 border border-input rounded-md leading-5 bg-secondary text-foreground placeholder-muted-foreground focus:outline-none focus:ring-1 focus:ring-orange focus:border-orange transition-all duration-300 sm:text-sm" placeholder="Search models..." />
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="min-h-screen pt-20 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
      <div class="mt-8">
        <div id="loading" class="flex flex-col items-center justify-center h-64 space-y-4">
          <div class="w-12 h-12 border-4 border-muted border-t-orange rounded-full animate-spin"></div>
          <p class="text-orange animate-pulse font-mono">ESTABLISHING UPLINK...</p>
        </div>
        <div id="error" class="hidden bg-destructive/20 border border-destructive p-6 rounded-lg text-center max-w-2xl mx-auto mt-12">
          <h3 class="text-destructive-foreground font-bold mb-2 text-xl">Connection Error</h3>
          <p id="error-msg" class="text-destructive-foreground/80 font-mono"></p>
        </div>
        <div id="content" class="hidden">
          <div class="mb-6 flex justify-between items-end border-b border-border pb-4">
            <div>
              <h2 id="section-title" class="text-xl font-bold text-foreground">All Models</h2>
              <p id="count-label" class="text-sm text-muted-foreground mt-1">Found 0 items</p>
            </div>
          </div>
          <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
          <div id="pagination" class="hidden flex items-center justify-between w-full max-w-md mx-auto mt-8 bg-card p-2 rounded-lg border border-border">
            <button id="prev-btn" onclick="changePage(-1)" class="px-4 py-2 rounded font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed text-sm uppercase tracking-wide bg-secondary text-foreground border border-border hover:bg-accent hover:border-orange hover:text-orange">&lt; Prev</button>
            <div class="text-foreground text-sm font-mono"><span id="current-page">1</span> / <span id="total-pages" class="text-muted-foreground">1</span></div>
            <button id="next-btn" onclick="changePage(1)" class="px-4 py-2 rounded font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed text-sm uppercase tracking-wide bg-secondary text-foreground border border-border hover:bg-accent hover:border-orange hover:text-orange">Next &gt;</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 overflow-hidden hidden">
      <div class="absolute inset-0 bg-background/80 backdrop-blur-sm" onclick="closeModal()"></div>
      <div class="absolute inset-y-0 right-0 max-w-md w-full flex">
        <div class="h-full w-full bg-background border-l border-border shadow-2xl flex flex-col modal-slide-in">
          <div class="flex items-center justify-between p-6 border-b border-border bg-card/50">
            <h2 id="modal-title" class="text-xl font-bold text-foreground truncate pr-4"></h2>
            <button onclick="closeModal()" class="p-2 rounded-full hover:bg-secondary text-muted-foreground hover:text-foreground transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div id="modal-body" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
          <div class="p-6 border-t border-border bg-card/50">
            <a id="modal-link" href="#" target="_blank" rel="noreferrer" class="w-full block text-center bg-orange text-primary font-bold py-3 rounded hover:bg-orange/90 transition-colors">View on OpenRouter</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const GITHUB_USER = "avayyyyyyy";
      const GITHUB_REPO = "stalker";
      const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
      
      let allData = [];
      let filteredData = [];
      let currentPage = 1;
      const itemsPerPage = 20;

      async function init() {
        await fetchData();
      }

      async function fetchData() {
        showLoading();
        try {
          const [rssRes, sitemapRes] = await Promise.all([
            fetch(`${RAW_BASE}/known_rss_models.json?t=${Date.now()}`),
            fetch(`${RAW_BASE}/known_sitemap_pages.json?t=${Date.now()}`)
          ]);
          
          const rssData = rssRes.ok ? await rssRes.json() : {};
          const sitemapData = sitemapRes.ok ? await sitemapRes.json() : {};
          
          const rssItems = Object.values(rssData).map(item => ({...item, source: 'rss'}));
          const sitemapItems = Object.values(sitemapData).map(item => ({...item, source: 'sitemap'}));
          
          allData = [...rssItems, ...sitemapItems];
          filteredData = [...allData];
          currentPage = 1;
          
          const latestDate = allData.reduce((latest, item) => {
            if (!item.pubDate) return latest;
            const date = new Date(item.pubDate);
            return date > latest ? date : latest;
          }, new Date(0));
          
          if (latestDate.getTime() > 0) {
            document.getElementById("last-updated").textContent = "Updated: " + latestDate.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
          }
          updateUI();
        } catch (err) {
          showError(err.message);
        }
      }

      function handleSearch(term) {
        const lower = term.toLowerCase();
        if (!lower) {
          filteredData = [...allData];
        } else {
          filteredData = allData.filter(item => {
            const name = (item.title || item.name || item.id || "").toLowerCase();
            const id = (item.id || "").toLowerCase();
            return name.includes(lower) || id.includes(lower);
          });
        }
        currentPage = 1;
        updateUI();
      }

      function changePage(delta) {
        currentPage += delta;
        renderGrid();
        document.getElementById("current-page").textContent = currentPage;
        updatePagination();
      }

      function updateUI() {
        showContent();
        document.getElementById("count-label").textContent = `Found ${filteredData.length} items`;
        renderGrid();
        updatePagination();
      }

      function renderGrid() {
        const grid = document.getElementById("grid");
        const start = (currentPage - 1) * itemsPerPage;
        const pageData = filteredData.slice(start, start + itemsPerPage);
        grid.innerHTML = pageData.map(item => {
          const name = item.title || item.name || item.id;
          const id = item.id;
          const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleDateString() : "";
          const source = item.source || "rss";
          const sourceLabel = source === "rss" ? "RSS" : "Sitemap";
          const sourceClass = source === "rss" ? "bg-orange/20 text-orange border-orange/30" : "bg-blue-500/20 text-blue-400 border-blue-500/30";
          return `
            <div onclick="openModal('${encodeURIComponent(JSON.stringify(item))}')" class="bg-card border border-border rounded-lg p-5 cursor-pointer card-hover flex flex-col justify-between h-full group">
              <div>
                <div class="flex justify-between items-start mb-2">
                  <h3 class="text-foreground font-bold text-lg truncate pr-2 group-hover:text-orange transition-colors" title="${name}">${name}</h3>
                  <span class="text-xs px-2 py-1 rounded bg-secondary text-muted-foreground border border-border whitespace-nowrap group-hover:border-orange/30 group-hover:text-orange transition-colors">${id.split("/")[0]}</span>
                </div>
                <p class="text-xs text-muted-foreground font-mono mb-3 truncate">${id}</p>
                <span class="text-xs px-2 py-1 rounded border ${sourceClass}">${sourceLabel}</span>
              </div>
              ${pubDate ? `<div class="text-xs text-muted-foreground border-t border-border pt-3 mt-3"><span class="block text-xs text-muted-foreground mb-1">Published</span><span class="text-foreground">${pubDate}</span></div>` : ""}
            </div>
          `;
        }).join("");
      }

      function updatePagination() {
        const total = Math.ceil(filteredData.length / itemsPerPage);
        document.getElementById("total-pages").textContent = total || 1;
        document.getElementById("prev-btn").disabled = currentPage === 1;
        document.getElementById("next-btn").disabled = currentPage >= total || total === 0;
        document.getElementById("pagination").classList.toggle("hidden", total <= 1);
      }

      function openModal(itemStr) {
        const item = JSON.parse(decodeURIComponent(itemStr));
        const name = item.title || item.name || item.id;
        document.getElementById("modal-title").textContent = name;
        document.getElementById("modal-link").href = `https://openrouter.ai/models/${item.id}`;
        
        let bodyHtml = `
          <div><h4 class="text-xs uppercase tracking-widest text-muted-foreground mb-1">Model ID</h4><div class="p-3 bg-secondary border border-border rounded font-mono text-sm text-foreground break-all">${item.id}</div></div>
        `;
        
        if (item.description) {
          bodyHtml += `<div><h4 class="text-xs uppercase tracking-widest text-muted-foreground mb-2">Description</h4><p class="text-sm text-foreground/80 leading-relaxed bg-secondary/50 p-4 rounded border border-border">${item.description}</p></div>`;
        } else {
          bodyHtml += `<div class="grid grid-cols-2 gap-4"><div class="bg-secondary/50 p-4 rounded border border-border"><h4 class="text-xs uppercase tracking-widest text-muted-foreground mb-2">Context Length</h4><p class="text-xl text-foreground font-mono">${(item.context_length || "N/A").toLocaleString()}</p></div><div class="bg-secondary/50 p-4 rounded border border-border"><h4 class="text-xs uppercase tracking-widest text-muted-foreground mb-2">Architecture</h4><p class="text-lg text-foreground font-mono capitalize">${item.architecture?.modality || "Text"}</p></div></div>`;
          
          if (item.pricing) {
            bodyHtml += `<div><h4 class="text-xs uppercase tracking-widest text-muted-foreground mb-2">Pricing Details (Per Token)</h4><div class="bg-secondary/50 rounded border border-border overflow-hidden"><div class="flex justify-between p-3 border-b border-border"><span class="text-muted-foreground">Prompt</span><span class="text-orange font-mono">$${parseFloat(item.pricing.prompt || 0).toFixed(6)}</span></div><div class="flex justify-between p-3 border-b border-border"><span class="text-muted-foreground">Completion</span><span class="text-orange font-mono">$${parseFloat(item.pricing.completion || 0).toFixed(6)}</span></div><div class="flex justify-between p-3"><span class="text-muted-foreground">Image</span><span class="text-orange font-mono">$${parseFloat(item.pricing.image || 0).toFixed(6)}</span></div></div></div>`;
          }
        }
        
        document.getElementById("modal-body").innerHTML = bodyHtml;
        document.getElementById("modal").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("modal").classList.add("hidden");
      }

      function showLoading() {
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("error").classList.add("hidden");
        document.getElementById("content").classList.add("hidden");
      }

      function showError(msg) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("error").classList.remove("hidden");
        document.getElementById("content").classList.add("hidden");
        document.getElementById("error-msg").textContent = msg;
      }

      function showContent() {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("error").classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");
      }

      init();
    </script>
  </body>
</html>
