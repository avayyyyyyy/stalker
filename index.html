<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>_stalker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: 'hsl(var(--border))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              orange: 'hsl(var(--orange))',
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
          },
        },
      }
    </script>
    <style>
      @tailwind base;
      @tailwind components;
      @tailwind utilities;

      @layer base {
        :root {
          --background: 0 0% 100%;
          --foreground: 0 0% 0%;
          --card: 0 0% 100%;
          --card-foreground: 0 0% 0%;
          --popover: 0 0% 100%;
          --popover-foreground: 0 0% 0%;
          --primary: 0 0% 0%;
          --primary-foreground: 0 0% 100%;
          --secondary: 0 0% 96%;
          --secondary-foreground: 0 0% 45%;
          --muted: 0 0% 96%;
          --muted-foreground: 0 0% 45%;
          --accent: 0 0% 96%;
          --accent-foreground: 0 0% 0%;
          --destructive: 0 84.2% 60.2%;
          --destructive-foreground: 0 0% 100%;
          --border: 0 0% 90%;
          --input: 0 0% 90%;
          --ring: 0 0% 0%;
          --radius: 0.5rem;
          --orange: 25 95% 53%;
        }

        .dark {
          --background: 0 0% 7%;
          --foreground: 0 0% 98%;
          --card: 0 0% 7%;
          --card-foreground: 0 0% 98%;
          --popover: 0 0% 7%;
          --popover-foreground: 0 0% 98%;
          --primary: 0 0% 98%;
          --primary-foreground: 0 0% 7%;
          --secondary: 0 0% 12%;
          --secondary-foreground: 0 0% 55%;
          --muted: 0 0% 12%;
          --muted-foreground: 0 0% 55%;
          --accent: 0 0% 12%;
          --accent-foreground: 0 0% 98%;
          --destructive: 0 62.8% 30.6%;
          --destructive-foreground: 0 0% 98%;
          --border: 0 0% 15%;
          --input: 0 0% 15%;
          --ring: 0 0% 83.9%;
          --orange: 25 95% 53%;
        }
      }

      @layer base {
        * {
          @apply border-border;
        }

        body {
          @apply bg-background text-foreground font-mono;
        }

        .orange-wavy {
          color: inherit;
          text-decoration: underline;
          text-decoration-style: wavy;
          text-decoration-color: hsl(var(--orange));
          text-decoration-thickness: 2px;
          text-underline-offset: 3px;
          transition: color 0.2s ease;
        }

        .orange-wavy:hover {
          color: hsl(var(--orange));
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          @apply font-bold;
        }
      }
    </style>
  </head>
  <body>
    <nav class="flex justify-between items-center px-8 py-3 border-b border-border">
      <div class="flex items-center gap-2">
        <div class="w-3.5 h-3.5 bg-orange"></div>
        <span class="text-xs tracking-widest font-bold text-orange">_stalker</span>
      </div>
      <span class="text-xs text-muted-foreground" id="last-updated">loading...</span>
    </nav>

    <div class="max-w-[900px] mx-auto px-8 py-8">
      <div class="flex justify-between items-start mb-10">
        <div>
          <div class="text-5xl font-black tracking-tighter leading-none">
            <span class="text-orange">_</span>STALKER
          </div>
          <div class="text-xs tracking-widest text-muted-foreground uppercase mt-3">OpenRouter Monitoring System</div>
        </div>
        <div class="text-right">
          <span class="block text-2xl text-orange font-bold" id="total-count">—</span>
          <span class="text-xs text-muted-foreground">Total Tracked</span>
        </div>
      </div>

      <div class="relative mb-8">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-orange">/</span>
        <input
          type="text"
          class="w-full px-4 py-3 pl-8 text-xs bg-secondary border border-input focus:border-orange outline-none"
          placeholder="search models and pages..."
          id="search"
        />
      </div>

      <div class="mb-8">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-border">
          <span class="text-xs tracking-widest text-muted-foreground uppercase">Models (RSS)</span>
          <span class="text-xs text-orange" id="rss-count">—</span>
        </div>
        <ul class="list-none" id="rss-list">
          <li class="text-muted-foreground py-4 text-xs">loading...</li>
        </ul>
        <div class="flex gap-2 mt-4 items-center" id="rss-pagination"></div>
      </div>

      <div class="mb-8">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-border">
          <span class="text-xs tracking-widest text-muted-foreground uppercase">Pages (Sitemap)</span>
          <span class="text-xs text-orange" id="sitemap-count">—</span>
        </div>
        <ul class="list-none" id="sitemap-list">
          <li class="text-muted-foreground py-4 text-xs">loading...</li>
        </ul>
        <div class="flex gap-2 mt-4 items-center" id="sitemap-pagination"></div>
      </div>
    </div>

    <div class="fixed top-0 right-0 w-[400px] h-full bg-background border-l border-border p-6 overflow-y-auto z-100 hidden" id="detail">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-border">
        <span class="text-sm font-bold text-orange">Details</span>
        <button class="bg-none border-none text-muted-foreground cursor-pointer text-xl" onclick="closeDetail()">×</button>
      </div>
      <div id="detail-content"></div>
    </div>
    <div class="fixed top-0 left-0 w-full h-full bg-black/70 z-99 hidden" id="overlay" onclick="closeDetail()"></div>

    <footer class="text-center py-8 text-[9px] text-muted-foreground tracking-widest uppercase">
      <a href="https://shubhankit.com" class="text-orange">shubhankit.com</a>
    </footer>

    <script>
      const GITHUB_USER = "avayyyyyyy";
      const GITHUB_REPO = "stalker";
      const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;

      const ITEMS_PER_PAGE = 50;
      let rssData = [],
        sitemapData = [];

      const escape = (s) => s?.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") || "";

      const showDetail = (item) => {
        document.getElementById("detail-content").innerHTML = `
        <div class="mb-4"><span class="text-[10px] text-muted-foreground uppercase block mb-1">ID</span><span class="text-xs">${escape(item.id)}</span></div>
        <div class="mb-4"><span class="text-[10px] text-muted-foreground uppercase block mb-1">Title</span><span class="text-xs">${escape(item.title)}</span></div>
        ${item.description ? `<div class="mb-4"><span class="text-[10px] text-muted-foreground uppercase block mb-1">Desc</span><span class="text-xs">${escape(item.description)}</span></div>` : ""}
        ${item.pubDate ? `<div class="mb-4"><span class="text-[10px] text-muted-foreground uppercase block mb-1">Date</span><span class="text-xs">${escape(item.pubDate)}</span></div>` : ""}
        <div class="mb-4"><span class="text-[10px] text-muted-foreground uppercase block mb-1">Source</span><span class="text-xs">${item.pubDate ? "RSS" : "Sitemap"}</span></div>
        <div class="mb-4"><span class="text-[10px] text-muted-foreground uppercase block mb-1">Link</span><span class="text-xs"><a href="${escape(item.link)}" target="_blank" class="text-orange break-all">${escape(item.link)}</a></span></div>
      `;
        document.getElementById("detail").classList.remove("hidden");
        document.getElementById("overlay").classList.remove("hidden");
      };

      const closeDetail = () => {
        document.getElementById("detail").classList.add("hidden");
        document.getElementById("overlay").classList.add("hidden");
      };

      const renderList = (data, listId, paginationId, countId) => {
        const q = document.getElementById("search").value.toLowerCase();
        const filtered = data.filter(
          (i) =>
            i.title.toLowerCase().includes(q) || i.id.toLowerCase().includes(q),
        );
        const totalPages = Math.max(
          1,
          Math.ceil(filtered.length / ITEMS_PER_PAGE),
        );
        const pag = document.getElementById(paginationId);
        let page = Math.min(parseInt(pag.dataset.page || "1"), totalPages);
        const items = filtered.slice(
          (page - 1) * ITEMS_PER_PAGE,
          page * ITEMS_PER_PAGE,
        );

        document.getElementById(countId).textContent = filtered.length;
        document.getElementById(listId).innerHTML = items.length
          ? items
              .map(
                (item, idx) => `
            <li class="flex justify-between items-center py-2 border-b border-border cursor-pointer hover:bg-secondary px-2 -mx-2" data-idx="${idx}">
              <div class="flex items-center gap-3">
                <span class="text-orange">›</span>
                <span>${item.title}</span>
              </div>
              <span class="text-xs text-muted-foreground text-right break-all hover:text-orange">${item.link}</span>
            </li>`,
              )
              .join("")
          : '<li class="text-muted-foreground py-4 text-xs">no results</li>';
        
        document.querySelectorAll('#' + listId + ' .cursor-pointer').forEach((el, idx) => {
          el.onclick = () => showDetail(items[idx]);
        });

        pag.dataset.page = page;
        pag.innerHTML =
          totalPages <= 1
            ? ""
            : `
        <button class="px-2 py-1 text-xs bg-none border border-border text-muted-foreground hover:border-orange hover:text-orange disabled:opacity-30 disabled:cursor-default" onclick="goPage('${listId}','${paginationId}','${countId}',${page - 1})" ${page === 1 ? "disabled" : ""}>prev</button>
        <span class="text-xs text-muted-foreground mx-2">${page}/${totalPages}</span>
        <button class="px-2 py-1 text-xs bg-none border border-border text-muted-foreground hover:border-orange hover:text-orange disabled:opacity-30 disabled:cursor-default" onclick="goPage('${listId}','${paginationId}','${countId}',${page + 1})" ${page >= totalPages ? "disabled" : ""}>next</button>
      `;
      };

      const goPage = (listId, pagId, countId, page) => {
        document.getElementById(pagId).dataset.page = page;
        const isRss = listId === "rss-list";
        renderList(isRss ? rssData : sitemapData, listId, pagId, countId);
      };

      const renderAll = () => {
        renderList(rssData, "rss-list", "rss-pagination", "rss-count");
        renderList(
          sitemapData,
          "sitemap-list",
          "sitemap-pagination",
          "sitemap-count",
        );
        document.getElementById("total-count").textContent =
          rssData.length + sitemapData.length;
      };

      const init = async () => {
        try {
          const [rss, sitemap] = await Promise.all([
            fetch(`${RAW_BASE}/known_rss_models.json?t=${Date.now()}`).then(
              (r) => r.json(),
            ),
            fetch(`${RAW_BASE}/known_sitemap_pages.json?t=${Date.now()}`).then(
              (r) => r.json(),
            ),
          ]);
          rssData = Object.values(rss).sort((a, b) =>
            a.title.localeCompare(b.title),
          );
          sitemapData = Object.values(sitemap).sort((a, b) =>
            a.title.localeCompare(b.title),
          );
          document.getElementById("last-updated").textContent =
            `updated ${new Date().toLocaleTimeString()}`;
          renderAll();
        } catch (e) {
          document.getElementById("rss-list").innerHTML =
            '<li class="text-muted-foreground py-4 text-xs">error loading data</li>';
          document.getElementById("sitemap-list").innerHTML =
            '<li class="text-muted-foreground py-4 text-xs">error loading data</li>';
        }
      };

      document.getElementById("search").addEventListener("input", renderAll);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDetail();
      });
      init();
    </script>
  </body>
</html>
