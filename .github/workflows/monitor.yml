name: OpenRouter Stalker

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Restore snapshots
        uses: actions/cache@v4
        with:
          path: |
            known_rss_models.json
            known_sitemap_pages.json
          key: snapshots-v1
          restore-keys: snapshots-v1

      - name: Run monitor
        run: bun run dist/monitor.js
        env:
          RUN_ONCE: "true"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save snapshots
        uses: actions/cache@v4
        with:
          path: |
            known_rss_models.json
            known_sitemap_pages.json
          key: snapshots-v1
